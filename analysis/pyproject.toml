[project]
name = "seazone-itapema-analysis"
version = "0.1.0"
description = "Análise de investimento short-stay Itapema — Desafio Seazone AI Builder"
requires-python = ">=3.11"

dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
analyze = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
